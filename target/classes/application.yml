spring:
  application:
    name: url-shortener
  datasource:
    url: jdbc:h2:mem:urlshortenerdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    open-in-view: false
    defer-datasource-initialization: true
    properties:
      hibernate:
        format_sql: false
  ai:
    anthropic:
      api-key: ${ANTHROPIC_API_KEY:not-set}
      chat:
        options:
          model: ${ANTHROPIC_MODEL:claude-opus-5}
          max-tokens: 4096
          temperature: 0.3

urlshortener:
  base-url: ${BASE_URL:http://localhost:8080}
  default-ttl-days: 365
  code-length: 6
  orchestration:
    approval-timeout-minutes: ${APPROVAL_TIMEOUT_MINUTES:30}
    max-retry-attempts: 3
    retry-backoff-ms: 2000
    retry-backoff-multiplier: 2.0

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

logging:
  level:
    com.wgblackmon: DEBUG
    org.springframework.ai: INFO
    org.hibernate.SQL: WARN
